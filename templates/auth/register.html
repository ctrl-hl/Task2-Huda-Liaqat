{% extends 'base.html' %}

{% block content %}

<div class="auth-box mt-5">

    <h2>
        Create Account
    </h2>

    <form method="POST">

        <input type="text"
               name="name"
               class="form-control mb-3"
               placeholder="Full Name"
               required>

        <input type="email"
               name="email"
               class="form-control mb-3"
               placeholder="Email Address"
               required>

        <input type="text"
               name="phone"
               class="form-control mb-3"
               placeholder="Phone Number"
               required>

        <input type="password"
               name="password"
               class="form-control mb-3"
               placeholder="Password"
               required>

        <input type="password"
               name="confirm_password"
               class="form-control mb-4"
               placeholder="Confirm Password"
               required>

        <button class="btn btn-success w-100">
            Register
        </button>

    </form>

</div>

{% endblock %}
