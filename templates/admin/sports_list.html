{% extends 'base.html' %}

{% block content %}

<h1>Manage Sports</h1>

<a href="/admin/sports/add" class="btn btn-success mb-3">
    Add Sport
</a>

<table class="table table-bordered">

<tr>
    <th>Name</th>
    <th>Fee</th>
    <th>Venue</th>
    <th>Actions</th>
</tr>

{% for sport in sports %}
<tr>
    <td>{{ sport.name }}</td>
    <td>{{ sport.fee }}</td>
    <td>{{ sport.venue }}</td>

    <td>
        <a href="/admin/sports/edit/{{ sport.id }}"
           class="btn btn-primary btn-sm">
            Edit
        </a>

        <form method="POST"
              action="/admin/sports/delete/{{ sport.id }}"
              style="display:inline-block;">

            <button class="btn btn-danger btn-sm">
                Delete
            </button>

        </form>
    </td>
</tr>
{% endfor %}

</table>

{% endblock %}
